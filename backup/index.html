<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - BSIT-3B</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e48519;
            --secondary: #6d15c0;
            --accent: #e3f2fd;
            --dark: #263238;
            --light: #f5f7fa;
            --muted: #607d8b;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--dark);
            line-height: 1.7;
        }

        .profile-wrapper {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(13, 71, 161, 0.12);
            overflow: hidden;
        }

        /* Header Section */
        .profile-header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 40px 35px;
            text-align: center;
        }

        .header-info h1 {
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 17px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Main Content */
        .profile-body {
            padding: 35px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 25px;
        }

        .info-item.full-width {
            grid-column: 1 / -1;
        }

        .info-label {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .info-value {
            font-size: 15px;
            color: #37474f;
            padding-top: 2px;
        }

        .divider-row {
            grid-column: 1 / -1;
            height: 1px;
            background: #e0e0e0;
            margin: 8px 0;
        }

        /* Education Table */
        .edu-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .edu-table th {
            background: var(--accent);
            color: var(--primary);
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid var(--primary);
        }

        .edu-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 15px;
        }

        .edu-table tr:last-child td {
            border-bottom: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .edu-table {
                display: block;
                overflow-x: auto;
            }
